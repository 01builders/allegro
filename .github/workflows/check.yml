name: Check
on: push
jobs:
  cargo:
    name: Cargo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        env:
          # Upstream v3 still declares node20; use GitHub's supported Node24 migration.
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        with:
          version: "25.x"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build sources
        run: cargo build --workspace --all-targets --all-features
      - name: Run linter
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build documentation
        run: nix develop --command just book
      - name: Check documentation built
        run: |
          if [ -d docs/book ]; then
            echo "Documentation built successfully"
          else
            echo "Documentation build failed"
            exit 1
          fi

  doc-links:
    name: Doc Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - name: Check Markdown links
        shell: bash
        run: |
          # Preserve the previous action's checker version, options and optional config.
          test -d docs
          options=(-q -v)
          if [ -f mlc_config.json ]; then
            options+=(--config mlc_config.json)
          fi
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          status=0
          while IFS= read -r -d '' file; do
            npx --yes --package=markdown-link-check@3.13.7 markdown-link-check "${options[@]}" "$file" >> "$log" 2>&1 || status=1
          done < <(find docs -type f -name '*.md' -print0)
          cat "$log"
          # The pinned checker can report dead links with exit 0; preserve the action's guard.
          if grep -q 'ERROR:' "$log"; then
            status=1
          fi
          exit "$status"
